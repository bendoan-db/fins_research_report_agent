[project]
name = "research-agent"
version = "0.1.0"
description = "Deep research-report agent over earnings-document Vector Search index."
readme = "AGENT_APP.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.129.0",
    "uvicorn>=0.41.0",
    "databricks-langchain>=0.17.0",
    "databricks-agents>=1.9.3",
    "langgraph>=1.1.0",
    "langchain>=1.0.0",
    "mlflow>=3.10.0",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_server", "scripts"]

[project.scripts]
start-server = "agent_server.start_server:main"
# test_agent.py is a Databricks notebook (run from the workspace), not a CLI.
